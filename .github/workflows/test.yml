name: Build

on:
  push:
    branches:
      - master
    
  workflow_dispatch:

jobs:
  build:
    runs-on: k8s-k5

    steps:
      - uses: actions/checkout@v6

      - name: Debug Kubernetes identity
        shell: bash
        run: |
          echo "=== Kubernetes identity ==="

          echo "Namespace:"
          cat /var/run/secrets/kubernetes.io/serviceaccount/namespace

          echo "ServiceAccount token file:"
          ls -l /var/run/secrets/kubernetes.io/serviceaccount/

          echo "JWT claims:"
          TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2)
          PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{
            sub,
            iss,
            aud,
            exp
          }'

      - name: Conect to vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: http://vault.vault.svc.cluster.local:8200
          method: kubernetes
          path: kubernetes-k5s
          role: test
          kubernetesTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
          outputToken: true
          secrets: |
            ${{ vars.VAULT_SECRETS_PATH }} ** | MYAPP_ ;

      - name: Debug Vault permissions
        if: always()
        shell: bash
        env:
          VAULT_TOKEN: ${{ steps.vault.outputs.vault_token }}
          VAULT_ADDR: http://vault.vault.svc.cluster.local:8200
        run: |
          if [[ -z "$VAULT_TOKEN" ]]; then
            echo "Vault token output is empty"
            exit 1
          fi

          curl -sS \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -X POST \
            -d '{
              "paths": [
                "secret/data/test/vite",
                "sys/internal/ui/mounts/secret/data/test/vite"
              ]
            }' \
            "$VAULT_ADDR/v1/sys/capabilities-self" |
            jq .

      - name: Generate secrets file
        shell: bash
        run: |
          umask 0770
          touch .build.env
          chmod 600 .build.env
          : > .build.env

          while IFS='=' read -r key value; do
            [[ "$key" == MYAPP_* ]] || continue

            key="${key#MYAPP_}"
            printf '%s=%s\n' "$key" "$value" >> .build.env
          done < <(env)

      - name: Login
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile.test
          tags: Angry-devs0/test-node:latest,Angry-devs0/test-node:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            ${{ hashFiles('.build.env') != '' && 'envfile=.build.env' || '' }}
