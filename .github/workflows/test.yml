name: Build

on:
  push:
    branches:
      - master
    
  workflow_dispatch:

jobs:
  build:
    runs-on: k8s-k5

    steps:
      - uses: actions/checkout@v6

      - name: Conect to vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: http://vault.vault.svc.cluster.local:8200
          method: kubernetes
          path: kubernetes-k5s
          role: test
          kubernetesTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
          secrets: |
            "${{ vars.VAULT_SECRETS_PATH }}" ** | MYAPP_ ;

      - name: Generate secrets file
        shell: bash
        run: |
          umask 0700
          : > .build.env

          while IFS='=' read -r key value; do
            [[ "$key" == MYAPP_* ]] || continue

            key="${key#MYAPP_}"
            printf '%s=%s\n' "$key" "$value" >> .build.env
          done < <(env)

      - name: Login
        uses: docker/login-action@v4
        with:
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile.test
          tags: Angry-devs0/test-node:latest,Angry-devs0/test-node:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            ${{ hashFiles('.build.env') != '' && 'envfile=.build.env' || '' }}
