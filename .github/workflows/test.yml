name: Build

on:
  push:
    branches:
      - master
    
  workflow_dispatch:

jobs:
  build:
    runs-on: k8s-k5

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Conect to vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: http://vault.vault.svc.cluster.local:8200
          method: kubernetes
          path: kubernetes-k5s
          role: test
          kubernetesTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
          outputToken: true
          secrets: |
            ${{ vars.VAULT_SECRETS_PATH }} ** | MYAPP_ ;

      - name: Generate secrets file
        shell: bash
        run: |
          umask 0770
          : > .build.env
          chmod 600 .build.env

          while IFS='=' read -r key value; do
            key="${key%$'\r'}"
            value="${value%$'\r'}"

            if [[ "$key" == MYAPP_* ]]; then
              clean_key="${key#MYAPP_}"
              clean_key="${clean_key^^}"
              printf '%s=%s\n' "$clean_key" "$value" >> .build.env
            fi
          done < <(env)

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: kubernetes
          driver-opts: |
            rootless=true
            namespace=runner
            serviceaccount=runner-builder

      - name: Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile.test
          tags: ghcr.io/angry-devs0/test-node:latest,ghcr.io/angry-devs0/test-node:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            ${{ hashFiles('.build.env') != '' && 'envfile=.build.env' || '' }}
